# Prévient Bing via IndexNow des pages modifiées à chaque mise en ligne sur main.
# Lancement manuel possible (onglet Actions) pour signaler toutes les pages du sitemap.
name: indexnow

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  signaler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Signaler les pages à IndexNow
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 outils/indexnow.py --tout
          else
            python3 outils/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
          fi
